<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta | Wi-Fi da Fé</title>
  <meta name="description" content="Crie sua conta gratuita no Wi-Fi da Fé e acompanhe cursos, práticas de formação e prazos da PUC-Campinas.">
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a class="navbar__brand" href="../../index.html"><span class="sinal">📶</span> Wi-Fi da Fé</a>
      <button class="navbar__toggle" id="menu-toggle" aria-expanded="false" aria-controls="navbar-menu">☰ Menu</button>
      <nav aria-label="Menu principal">
        <ul class="navbar__menu" id="navbar-menu">
          <li><a href="../../index.html">Início</a></li>
          <li><a href="cursos.html">Cursos</a></li>
          <li><a href="avisos.html">Avisos</a></li>
          <li><a href="perfil.html">Perfil</a></li>
        </ul>
      </nav>
      <div class="navbar__actions">
        <a class="btn btn--ghost btn--sm" href="login.html">Entrar</a>
        <a class="btn btn--primary btn--sm" href="cadastro.html" aria-current="page">Criar conta</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="form-card">
        <h1>Criar sua conta</h1>
        <p class="text-muted">Gratuito para toda a comunidade acadêmica da PUC-Campinas.</p>

        <form action="#" method="post" novalidate>
          <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail institucional</label>
            <input type="email" id="email" name="email" placeholder="seunome@puccampinas.edu.br" required>

            <div class="form-row">
              <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="6" required>
              </div>
              <div>
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" name="confirmar_senha" minlength="6" required>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Perfil acadêmico</legend>

            <label for="curso-interesse">Curso ou área de interesse</label>
            <select id="curso-interesse" name="curso_interesse">
              <option value="">Selecione...</option>
              <option>Engenharia da Computação</option>
              <option>Administração</option>
              <option>Psicologia</option>
              <option>Direito</option>
              <option>Outro</option>
            </select>

            <label><input type="checkbox" name="termos" required style="width:auto; display:inline-block;"> Aceito os <a href="#">termos de uso</a></label>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--block">Criar conta</button>
          </div>
        </form>

        <p class="mt-lg center">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <address>
        Projeto Integrador — Wi-Fi da Fé (Turma 102)<br>
        Contato: <a href="mailto:wifidafe@puc-campinas.edu.br">wifidafe@puc-campinas.edu.br</a>
      </address>
    </div>
  </footer>

  <script src="../scripts/main.js" defer></script>
</body>
</html>
